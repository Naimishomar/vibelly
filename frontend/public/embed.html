<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Vibelly Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(120% 140% at 50% 0%, #1d2025 0%, #101114 70%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
    .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .logo a { color: #fff; text-decoration: none; }
    .tag { font-size: 13px; color: #a1a1aa; margin-bottom: 18px; }
    .btn {
      display: inline-block;
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      font-size: 12px;
      color: #a1a1aa;
    }
    .live-count {
      font-weight: 700;
      color: #fff;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #34d399;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,0.6); }
      70% { opacity: 0.85; box-shadow: 0 0 0 7px rgba(52,211,153,0); }
      100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }
    .powered {
      margin-top: 18px;
      font-size: 11px;
      color: #71717a;
    }
    .powered a { color: #a1a1aa; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><a href="https://vibelly.fun/?ref=widget">Vibelly</a></div>
    <p class="tag">Free random video chat with strangers</p>
    <a class="btn" href="https://vibelly.fun/?ref=widget">Start Chatting</a>
    <div class="live">
      <span class="dot"></span>
      <span><span class="live-count" id="onlineCount">…</span> people are online now</span>
    </div>
    <p class="powered">
      <a href="https://vibelly.fun/?ref=widget">Powered by Vibelly</a> &middot; anonymous, free &amp; safe
    </p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('onlineCount');
      try {
        fetch('https://api.vibelly.fun/api/stats/online')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var n = Number(d.online);
            el.textContent = (isFinite(n) && n > 0) ? (n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n)) : '0';
          });
      } catch (e) {}
    })();
  </script>
</body>
</html>
